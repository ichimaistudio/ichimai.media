<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans CJK JP";color:#1F1D1A;background:#F3EFE8}
.serif{font-family:"Noto Serif CJK JP"}
.pg{position:absolute;inset:0;display:none}
#cover .k{position:absolute;top:395px;left:0;right:0;text-align:center;font-size:32px;letter-spacing:.32em;color:#8A8276}
#cover .t{position:absolute;top:450px;left:0;right:0;text-align:center;font-size:98px;font-weight:700;line-height:1.32}
#cover .t em{font-style:normal;color:#2F5A45}
#cover .f{position:absolute;top:855px;left:0;right:0;text-align:center;font-size:30px;color:#2F5A45;font-weight:600;letter-spacing:.12em}
.ba{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:34px}
.ba img{display:block;width:250px;border-radius:29px;box-shadow:0 20px 40px rgba(40,30,20,.16)}
.ba .ar{font-size:64px;color:#C9A98A;font-weight:700}
.lb{font-size:26px;letter-spacing:.3em;color:#8A8276;text-align:center;margin-top:16px}
#cover .ba{top:935px}
#cover .logo{position:absolute;top:1560px;left:0;right:0;text-align:center;font-size:52px;font-weight:700;letter-spacing:.05em}
#story{background:#1F1D1A;color:#F3EFE8}
#story .k{position:absolute;top:300px;left:0;right:0;text-align:center;font-size:32px;letter-spacing:.35em;color:#C9A98A}
#story .t{position:absolute;top:370px;left:0;right:0;text-align:center;font-size:84px;font-weight:700;line-height:1.4}
#story .ba{top:640px}
#story .ba img{width:300px;border-radius:34px;box-shadow:none}
#story .lb{color:#C9A98A}
#story .s{position:absolute;top:1340px;left:0;right:0;text-align:center;font-size:40px;line-height:1.7;color:#E6DED2}
#story .pill{position:absolute;top:1490px;left:50%;transform:translateX(-50%);white-space:nowrap;border:2px solid #C9A98A;color:#F3EFE8;font-size:38px;font-weight:700;padding:24px 56px;border-radius:999px}
#story .f{position:absolute;top:1630px;left:0;right:0;text-align:center;font-size:26px;color:#9a9186;letter-spacing:.1em}
#story .logo{position:absolute;top:1700px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;letter-spacing:.05em}
</style></head><body>
<div class="pg" id="cover">
 <div class="k">CAFE ｜ BEFORE → AFTER</div>
 <div class="t serif">カフェの<br>ホームページ、<br><em>作り直してみた</em></div>
 <div class="f">※架空のお店です</div>
 <div class="ba"><div><img src="img03/before.png"><div class="lb">BEFORE</div></div><div class="ar">→</div><div><img src="img03/after.png"><div class="lb">AFTER</div></div></div>
 <div class="logo serif">ICHIMAI.</div>
</div>
<div class="pg" id="story">
 <div class="k">NEW REEL</div>
 <div class="t serif">検索して、これが出たら<br>行きたくなる？</div>
 <div class="ba"><div><img src="img03/before.png"><div class="lb">BEFORE</div></div><div class="ar">→</div><div><img src="img03/after.png"><div class="lb">AFTER</div></div></div>
 <div class="s">カフェのホームページの惜しいところ3つと、<br>作り直すとどう変わるか。</div>
 <div class="pill">プロフィールのリールで公開中</div>
 <div class="f">※登場するお店は架空です</div>
 <div class="logo serif">ICHIMAI.</div>
</div>
<script>
window.render=t=>{document.getElementById('cover').style.display=t<1?'block':'none';document.getElementById('story').style.display=t>=1?'block':'none'};
render(0);
</script></body></html>
