<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans CJK JP";color:#1F1D1A;background:#F3EFE8}
.serif{font-family:"Noto Serif CJK JP"}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k{font-size:34px;letter-spacing:.35em;color:#8A8276}
.t{font-size:108px;font-weight:600;line-height:1.3;margin:36px 0}
.ba{display:flex;align-items:center;gap:40px;margin:30px 0}
.box{width:300px;height:520px;border-radius:40px;border:12px solid #111;overflow:hidden;position:relative}
.bef{background:#fff}
.bef i{display:block;height:70px;background:#1d4fd8}
.bef b{display:block;margin:14px;height:18px;background:#f2b4b4}
.bef s{display:block;margin:10px 14px;height:9px;background:#ccc}
.aft{background:linear-gradient(180deg,#e9d6c2,#7d5a40)}
.aft .n{position:absolute;left:24px;bottom:120px;color:#fff;font-size:64px;font-weight:600}
.aft .btn{position:absolute;left:20px;right:20px;bottom:36px;height:52px;border-radius:99px;background:#FFFDF9}
.arrow{font-size:80px;color:#2F5A45}
.lab{font-size:30px;letter-spacing:.3em;margin-top:18px;color:#8A8276}
.s{font-size:40px;line-height:1.7;margin-top:30px}
.logo{font-size:56px;font-weight:600;margin-top:90px;letter-spacing:.04em}
.pill{display:inline-block;background:#2F5A45;color:#F3EFE8;font-size:38px;padding:22px 48px;border-radius:99px;margin-top:50px}
</style></head><body>
<div class="c" id="cover">
 <div class="k">BEFORE → AFTER</div>
 <div class="t serif">美容室の<br>ホームページ、<br>作り直してみた</div>
 <div class="ba">
  <div><div class="box bef"><i></i><b></b><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s></div><div class="lab">BEFORE</div></div>
  <div class="arrow">→</div>
  <div><div class="box aft"><div class="n serif">ことり</div><div class="btn"></div></div><div class="lab">AFTER</div></div>
 </div>
 <div class="logo serif">ICHIMAI.</div>
</div>
<div class="c" id="story" style="display:none;background:#1F1D1A;color:#F3EFE8">
 <div class="k" style="color:#C9A98A">NEW REEL</div>
 <div class="t serif" style="font-size:92px">そのホームページ、<br>予約したくなる？</div>
 <div class="ba">
  <div><div class="box bef" style="border-color:#444"><i></i><b></b><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s><s></s></div><div class="lab" style="color:#C9A98A">BEFORE</div></div>
  <div class="arrow" style="color:#C9A98A">→</div>
  <div><div class="box aft" style="border-color:#444"><div class="n serif">ことり</div><div class="btn"></div></div><div class="lab" style="color:#C9A98A">AFTER</div></div>
 </div>
 <div class="s">惜しいポイント3つと、<br>作り直したらどうなるか。</div>
 <div class="pill">リールで公開中 ▶︎</div>
 <div class="logo serif" style="font-size:44px;margin-top:70px">ICHIMAI.</div>
</div>
<script>
const m=new URLSearchParams(location.search).get('m')||'cover';
document.getElementById('cover').style.display=m=='cover'?'flex':'none';
document.getElementById('story').style.display=m=='story'?'flex':'none';
window.render=()=>{};
</script></body></html>
