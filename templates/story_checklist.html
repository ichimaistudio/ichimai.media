<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans CJK JP";color:#1F1D1A;background:#F3EFE8}
.serif{font-family:"Noto Serif CJK JP"}
.wrap{position:absolute;inset:0;padding:200px 96px 250px;display:flex;flex-direction:column}
.k{font-size:30px;letter-spacing:.4em;color:#8A8276}
.k b{display:inline-block;width:56px;height:2px;background:#C9A98A;vertical-align:middle;margin-right:22px}
h1{font-size:80px;font-weight:700;line-height:1.38;margin-top:44px;letter-spacing:.02em}
h1 em{font-style:normal;color:#2F5A45}
.lead{font-size:38px;line-height:1.75;margin-top:40px;color:#4a453e}
.list{margin-top:64px;display:flex;flex-direction:column;gap:30px}
.item{display:flex;align-items:center;gap:36px;background:#FFFDF9;border-radius:28px;padding:40px 44px;box-shadow:0 2px 0 rgba(31,29,26,.04)}
.n{flex:none;width:92px;height:92px;border-radius:50%;background:#2F5A45;color:#F3EFE8;font-size:46px;display:flex;align-items:center;justify-content:center;font-weight:600}
.item p{font-size:50px;font-weight:700;line-height:1.3}
.item small{display:block;font-size:30px;font-weight:400;color:#8A8276;margin-top:8px}
.foot{margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;align-items:flex-end}
.foot .msg{font-size:34px;line-height:1.7;color:#4a453e}
.foot .logo{font-size:46px;font-weight:600;letter-spacing:.04em}
</style></head><body>
<div class="wrap">
 <div class="k"><b></b>3秒チェック</div>
 <h1 class="serif">お店の名前で、<br>スマホ検索してみて。<br><em>3秒で、分かりますか？</em></h1>
 <div class="lead">はじめてのお客さまの目線で、<br>この3つだけ確かめてみましょう。</div>
 <div class="list">
  <div class="item"><div class="n serif">1</div><p>何のお店か<small>ひと目で業種と雰囲気が伝わる</small></p></div>
  <div class="item"><div class="n serif">2</div><p>どこにあるか<small>最寄り駅・地図にすぐ届く</small></p></div>
  <div class="item"><div class="n serif">3</div><p>どう予約するか<small>ボタンが指の届く場所にある</small></p></div>
 </div>
 <div class="foot">
  <div class="msg">ひとつでも迷ったら、<br>DMでお気軽にご相談ください。</div>
  <div class="logo serif">ICHIMAI.</div>
 </div>
</div>
<script>window.render=()=>{};</script></body></html>
