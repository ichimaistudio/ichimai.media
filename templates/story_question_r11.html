<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans CJK JP";color:#F3EFE8;background:#2F5A45}
.serif{font-family:"Noto Serif CJK JP"}
.wrap{position:absolute;inset:0;padding:210px 92px 300px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.k{font-size:30px;letter-spacing:.4em;color:#C9A98A}
.logo{font-size:38px;font-weight:700;letter-spacing:.04em;color:#F3EFE8}
.k b{display:inline-block;width:56px;height:2px;background:#C9A98A;vertical-align:middle;margin-right:22px}
h1{font-size:72px;font-weight:700;line-height:1.38;margin-top:40px;letter-spacing:.02em}
h1 em{font-style:normal;color:#E9D7C2}
.lead{font-size:38px;line-height:1.6;margin-top:30px;color:rgba(243,239,232,.82)}
.lead strong{color:#F3EFE8;border-bottom:3px solid #C9A98A;padding-bottom:2px}
.list{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.item{display:flex;align-items:center;gap:32px;background:#F3EFE8;color:#1F1D1A;border-radius:24px;padding:24px 38px}
.n{flex:none;width:76px;height:76px;border-radius:50%;background:#2F5A45;color:#F3EFE8;font-size:40px;display:flex;align-items:center;justify-content:center;font-weight:700}
.item p{font-size:42px;font-weight:700;line-height:1.3}
.item small{display:block;font-size:28px;font-weight:400;color:#8A8276;margin-top:6px}
.foot{margin-top:auto;border-top:2px solid rgba(201,169,138,.5);padding-top:30px}
.foot .msg{font-size:36px;line-height:1.6;font-weight:700;color:#F3EFE8}
.foot .sub{font-size:27px;line-height:1.6;color:rgba(243,239,232,.7);margin-top:10px}
</style></head><body>
<div class="wrap">
 <div class="top"><div class="k"><b></b>質問募集</div><div class="logo serif">ICHIMAI.</div></div>
 <h1 class="serif">ホームページのこと、<br><em>いま、困っていることは？</em></h1>
 <div class="lead"><strong>番号だけの返信</strong>でも大歓迎です。</div>
 <div class="list">
  <div class="item"><div class="n serif">1</div><p>そもそも、まだ無い<small>Instagramだけでやっている</small></p></div>
  <div class="item"><div class="n serif">2</div><p>スマホだと見づらい<small>文字が小さい・探しにくい</small></p></div>
  <div class="item"><div class="n serif">3</div><p>情報が古いまま<small>営業時間・メニュー・料金</small></p></div>
  <div class="item"><div class="n serif">4</div><p>予約につながらない<small>見られても、連絡が来ない</small></p></div>
  <div class="item"><div class="n serif">5</div><p>更新のやり方が分からない<small>頼める人がいない</small></p></div>
 </div>
 <div class="foot">
  <div class="msg">↓ このストーリーに返信（DM）で教えてください</div>
  <div class="sub">いただいた声には、お店の名前を出さずに、今後の投稿でお答えします。</div>
 </div>
</div>
<script>window.render=()=>{};</script></body></html>
