<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans CJK JP";color:#1F1D1A;background:#F3EFE8}
.serif{font-family:"Noto Serif CJK JP"}
.wrap{position:absolute;inset:0;padding:200px 88px 270px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.k{font-size:30px;letter-spacing:.4em;color:#2F5A45;font-weight:700}
.k b{display:inline-block;width:56px;height:2px;background:#C9A98A;vertical-align:middle;margin-right:22px}
.logo{font-size:38px;font-weight:700;letter-spacing:.04em}
h1{font-size:76px;font-weight:700;line-height:1.36;margin-top:44px;letter-spacing:.01em}
h1 em{font-style:normal;color:#2F5A45;border-bottom:8px solid #C9A98A;padding:0 4px}
.lead{font-size:38px;line-height:1.6;margin-top:22px;color:#6B645A}
.stage{position:relative;margin-top:56px;height:770px}
.phone{position:absolute;left:0;top:0;width:430px;height:770px;border-radius:58px;background:#1F1D1A;padding:16px;box-shadow:0 24px 50px rgba(31,29,26,.18)}
.scr{width:100%;height:100%;border-radius:44px;background:#FBF8F3;overflow:hidden;position:relative}
.bar{height:54px;display:flex;align-items:center;justify-content:center}
.bar i{width:110px;height:26px;border-radius:14px;background:#1F1D1A}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 26px 16px}
.nav .nm{font-family:"Noto Serif CJK JP";font-size:25px;font-weight:700}
.nav .hb{width:30px;height:16px;border-top:3px solid #1F1D1A;border-bottom:3px solid #1F1D1A;position:relative}
.nav .hb:after{content:"";position:absolute;left:0;right:0;top:3.5px;border-top:3px solid #1F1D1A}
.hero{margin:0 18px;height:300px;border-radius:22px;background:linear-gradient(160deg,#DCE6DC,#C7D6C6);position:relative;overflow:hidden}
.st{position:absolute;bottom:0;width:6px;background:#2F5A45;border-radius:3px}
.fl{position:absolute;border-radius:50%}
.vase{position:absolute;left:50%;bottom:0;width:120px;height:92px;margin-left:-60px;background:#C9A98A;border-radius:18px 18px 10px 10px}
.copy{padding:22px 26px 0}
.copy .t{font-family:"Noto Serif CJK JP";font-size:33px;font-weight:700;line-height:1.4}
.copy .p{font-size:21px;color:#6B645A;margin-top:12px;display:flex;align-items:center;gap:8px}
.copy .p:before{content:"";width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#2F5A45;flex:none}
.btn{margin:26px 26px 0;height:76px;border-radius:40px;background:#2F5A45;color:#F3EFE8;font-size:25px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mk{position:absolute;width:58px;height:58px;border-radius:50%;background:#C9A98A;color:#1F1D1A;font-family:"Noto Serif CJK JP";font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center;border:4px solid #F3EFE8;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.notes{position:absolute;left:478px;top:0;right:0;display:flex;flex-direction:column;gap:0}
.note{position:absolute;left:0;right:0}
.note .h{display:flex;align-items:center;gap:16px}
.note .h span{flex:none;width:58px;height:58px;border-radius:50%;background:#2F5A45;color:#F3EFE8;font-family:"Noto Serif CJK JP";font-weight:700;font-size:32px;display:flex;align-items:center;justify-content:center}
.note .h p{font-size:42px;font-weight:700;line-height:1.25}
.note .d{font-size:28px;line-height:1.55;color:#6B645A;margin-top:12px;padding-left:2px}
.note .d b{color:#1F1D1A}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.foot .msg{font-size:37px;line-height:1.55;font-weight:700}
.foot .msg em{font-style:normal;color:#2F5A45}
.foot .sub{font-size:27px;line-height:1.6;color:#6B645A;margin-top:12px}
.tag{flex:none;font-size:25px;color:#6B645A;border:2px solid #C9A98A;border-radius:30px;padding:8px 20px;margin-bottom:6px}
</style></head><body>
<div class="wrap">
 <div class="top"><div class="k"><b></b>制作の裏側</div><div class="logo serif">ICHIMAI.</div></div>
 <h1 class="serif">トップ案を作るとき、<br>最初に決める<em>3つ</em>。</h1>
 <div class="lead">色やフォントを選ぶのは、このあとです。</div>

 <div class="stage">
  <div class="phone"><div class="scr">
   <div class="bar"><i></i></div>
   <div class="nav"><div class="nm">花屋 こもれび舎</div><div class="hb"></div></div>
   <div class="hero">
    <div class="st" style="left:180px;height:200px;transform:rotate(-14deg);transform-origin:bottom"></div>
    <div class="st" style="left:197px;height:225px"></div>
    <div class="st" style="left:214px;height:195px;transform:rotate(14deg);transform-origin:bottom"></div>
    <div class="fl" style="left:118px;top:70px;width:84px;height:84px;background:#E7B8A6"></div>
    <div class="fl" style="left:170px;top:36px;width:96px;height:96px;background:#F3EFE8"></div>
    <div class="fl" style="left:234px;top:78px;width:80px;height:80px;background:#D99A86"></div>
    <div class="fl" style="left:150px;top:118px;width:60px;height:60px;background:#F1D9A8"></div>
    <div class="fl" style="left:226px;top:132px;width:54px;height:54px;background:#EFE2D3"></div>
    <div class="vase"></div>
   </div>
   <div class="copy">
    <div class="t">季節の花束と、<br>ちいさな贈りもの。</div>
    <div class="p">国立駅 南口から 徒歩4分</div>
   </div>
   <div class="btn">LINEで 予約・取り置き</div>
  </div></div>
  <div class="mk" style="left:372px;top:462px">1</div>
  <div class="mk" style="left:372px;top:552px">2</div>
  <div class="mk" style="left:372px;top:652px">3</div>

  <div class="notes">
   <div class="note" style="top:250px"><div class="h"><span>1</span><p>何のお店？</p></div><div class="d">「何が買えるか」を<br><b>ひとこと</b>で。</div></div>
   <div class="note" style="top:440px"><div class="h"><span>2</span><p>どこにある？</p></div><div class="d"><b>駅から何分</b>を、最初の画面に。</div></div>
   <div class="note" style="top:600px"><div class="h"><span>3</span><p>どう頼む？</p></div><div class="d">予約の方法は<b>ボタン1つ</b>に<br>しぼって、迷わせない。</div></div>
  </div>
 </div>

 <div class="foot">
  <div>
   <div class="msg">あなたのお店の「3つ」、<br><em>DMで一緒に整理しませんか。</em></div>
   <div class="sub">ご相談はプロフィールのリンク・DMからどうぞ。</div>
  </div>
  <div class="tag">※架空のお店です</div>
 </div>
</div>
<script>window.render=()=>{};</script></body></html>
